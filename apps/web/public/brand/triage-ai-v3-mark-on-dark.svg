<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Triage AI logo mark">
  <defs>
    <linearGradient id="tGrad" x1="82" y1="110" x2="360" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDE8E3"/>
      <stop offset="0.48" stop-color="#72E3AD"/>
      <stop offset="1" stop-color="#72E3AD"/>
    </linearGradient>
    <linearGradient id="branchGrad" x1="190" y1="398" x2="430" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#72E3AD"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="paneGrad" x1="172" y1="158" x2="310" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#72E3AD" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#72E3AD" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#121212"/>
  <g filter="url(#softShadow)">
    <!-- abstract T / decision stem -->
    <path d="M88 112 H326 C338 112 346 120 346 132 V154 C346 166 338 174 326 174 H242 V404 C242 414 235 422 225 425 L171 441 V174 H88 C76 174 68 166 68 154 V132 C68 120 76 112 88 112 Z" fill="url(#tGrad)"/>
    <!-- translucent routing plane -->
    <path d="M190 177 L306 177 L240 330 L172 386 Z" fill="url(#paneGrad)"/>
    <!-- evidence / routing branches -->
    <path d="M210 260 C260 224 300 190 362 154" fill="none" stroke="url(#branchGrad)" stroke-width="26" stroke-linecap="round"/>
    <path d="M210 286 C274 282 330 270 414 250" fill="none" stroke="url(#branchGrad)" stroke-width="24" stroke-linecap="round"/>
    <path d="M205 318 C258 336 312 372 372 404" fill="none" stroke="url(#branchGrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- branch nodes -->
    <circle cx="372" cy="151" r="24" fill="#E2E8F0" stroke="#72E3AD" stroke-width="6"/>
    <circle cx="424" cy="248" r="24" fill="#E2E8F0" stroke="#72E3AD" stroke-width="6"/>
    <circle cx="379" cy="407" r="24" fill="#E2E8F0" stroke="#72E3AD" stroke-width="6"/>
  </g>
</svg>