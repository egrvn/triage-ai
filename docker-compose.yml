services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coursework
      POSTGRES_PASSWORD: coursework
      POSTGRES_DB: coursework
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursework -d coursework"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      STORAGE_MODE: postgres
      DATABASE_URL: postgresql://coursework:coursework@postgres:5432/coursework?schema=public
      CORS_ORIGIN: "*"
    ports:
      - "8080:8080"
    command: sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/server.js"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
